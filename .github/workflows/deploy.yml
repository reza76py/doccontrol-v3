name: Deploy DocControl V3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on production server
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} bash << EOF
            {
              echo "DEBUG=False"
              echo "SECRET_KEY=${SECRET_KEY}"
              echo "DB_ENGINE=django.db.backends.mysql"
              echo "DB_NAME=doccontrol_v3"
              echo "DB_USER=root"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              echo "DB_HOST=db"
              echo "DB_PORT=3306"
              echo "ALLOWED_HOSTS=doccontrol-v3.rezteche.com"
              echo "CORS_ALLOWED_ORIGINS=https://doccontrol-v3.rezteche.com"
              echo "CSRF_TRUSTED_ORIGINS=https://doccontrol-v3.rezteche.com"
              echo "EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend"
              echo "EMAIL_HOST=mail.privateemail.com"
              echo "EMAIL_PORT=587"
              echo "EMAIL_USE_TLS=True"
              echo "EMAIL_HOST_USER=info@rezteche.com"
              echo "EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}"
              echo "DEFAULT_FROM_EMAIL=DocControl <info@rezteche.com>"
              echo "FRONTEND_URL=https://doccontrol-v3.rezteche.com"
              echo "VITE_API_URL=https://doccontrol-v3.rezteche.com"
            } > /var/www/doccontrol-v3/.env
            chmod 600 /var/www/doccontrol-v3/.env
            cd /var/www/doccontrol-v3
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            bash deploy.sh
          EOF
